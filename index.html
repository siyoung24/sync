<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메모 앱 테스트 페이지</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { display: flex; gap: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 350px; }
        input { width: 90%; padding: 8px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #log { margin-top: 20px; padding: 15px; background: #eee; border-radius: 5px; white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h2>API 테스트 임시 화면</h2>
    <div class="container">
        <!-- 회원가입 섹션 -->
        <div class="card">
            <h3>회원가입</h3>
            <input type="text" id="regName" placeholder="이름">
            <input type="email" id="regEmail" placeholder="이메일 (test@test.com)">
            <input type="password" id="regPw" placeholder="비밀번호">
            <input type="password" id="regPwConfirm" placeholder="비밀번호 확인">
            <button onclick="register()">회원가입 실행</button>
        </div>

        <!-- 로그인 섹션 -->
        <div class="card">
            <h3>로그인</h3>
            <input type="email" id="loginEmail" placeholder="이메일">
            <input type="password" id="loginPw" placeholder="비밀번호">
            <button onclick="login()" style="background: #28a745;">로그인 실행</button>
        </div>
    </div>

    <h4>결과 로그:</h4>
    <div id="log">결과가 여기에 표시됩니다.</div>

    <script>
        const API_URL = "http://localhost:5000/api/Auth"; 

        async function register() {
            const data = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPw').value,
                passwordConfirm: document.getElementById('regPwConfirm').value
            };
            sendRequest('/register', data);
        }

        async function login() {
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPw').value
            };
            sendRequest('/login', data);
        }

        async function sendRequest(path, data) {
            const logDiv = document.getElementById('log');
            try {
                const response = await fetch(API_URL + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                logDiv.innerText = JSON.stringify(result, null, 2);
                if(result.accessToken) {
                    logDiv.style.border = "2px solid #28a745";
                    alert("성공! 토큰이 발급되었습니다.");
                }
            } catch (error) {
                logDiv.innerText = "에러 발생: " + error.message;
                logDiv.style.border = "2px solid #dc3545";
            }
        }
    </script>
</body>
</html>
